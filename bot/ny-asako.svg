<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Le sary que l'Assistant Ny asako renvoie quand on lui envoie une photo
       (live.js, botMediaSary) : ce que fait l'application, d'un coup d'œil. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b22"/>
      <stop offset="1" stop-color="#123540"/>
    </linearGradient>
    <linearGradient id="tuile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3a46"/>
      <stop offset="1" stop-color="#162d37"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#fond)"/>
  <circle cx="560" cy="60" r="120" fill="#4fd8e0" opacity="0.08"/>
  <circle cx="70" cy="370" r="90" fill="#4fd8e0" opacity="0.06"/>

  <text x="40" y="74" font-size="44" font-weight="800" fill="#ffffff">Ny asako</text>
  <text x="42" y="108" font-size="19" fill="#9fe7ec">Ny asanao rehetra amin'ny toerana iray</text>

  <g font-size="21" fill="#ffffff" font-weight="600">
    <rect x="40" y="140" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="128" y="182" text-anchor="middle" font-size="34">📦</text>
    <text x="128" y="216" text-anchor="middle">Stock</text>

    <rect x="232" y="140" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="320" y="182" text-anchor="middle" font-size="34">🧾</text>
    <text x="320" y="216" text-anchor="middle">Factures</text>

    <rect x="424" y="140" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="512" y="182" text-anchor="middle" font-size="34">🛒</text>
    <text x="512" y="216" text-anchor="middle">Botika</text>

    <rect x="40" y="248" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="128" y="290" text-anchor="middle" font-size="34">💰</text>
    <text x="128" y="324" text-anchor="middle">Portefeuille</text>

    <rect x="232" y="248" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="320" y="290" text-anchor="middle" font-size="34">👷</text>
    <text x="320" y="324" text-anchor="middle">Mpiasa</text>

    <rect x="424" y="248" width="176" height="92" rx="18" fill="url(#tuile)" stroke="#4fd8e0" stroke-opacity="0.35"/>
    <text x="512" y="290" text-anchor="middle" font-size="34">🔴</text>
    <text x="512" y="324" text-anchor="middle">Live</text>
  </g>

  <text x="320" y="378" text-anchor="middle" font-size="16" fill="#9fe7ec">🤖 Assistant Ny asako · nyasako.com</text>
</svg>
