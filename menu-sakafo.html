<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Menu sakafo</title>
<!-- Installable : le manifeste n'a pas de start_url, l'application s'ouvre
     donc à l'adresse même où on l'a installée — « ?id=<hôtel>&latabatra=… »
     compris, ce que la page retient aussi (localStorage) au cas où. -->
<link rel="manifest" href="/menu-sakafo.webmanifest">
<meta name="theme-color" content="#0f171b">
<link rel="icon" href="/icone-192.png">
<link rel="apple-touch-icon" href="/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu sakafo">
<!-- Le lien d'une latabatra (« ?id=…&latabatra=3 ») fait de la page
     l'application de cette table : un manifeste à elle (servi par
     netlify/edge-functions/menu-manifeste.js), son nom partout. Installée,
     « T3 » se pose à côté de « T4 » au lieu de la remplacer. -->
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const id = p.get('id') || '', n = Number(p.get('latabatra'));
  if (!/^[0-9a-f-]{36}$/i.test(id) || !Number.isInteger(n) || n < 1 || n > 500) return;
  document.querySelector('link[rel="manifest"]').href =
    '/menu-sakafo.webmanifest?id=' + encodeURIComponent(id) + '&latabatra=' + n;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'T' + n;
  document.title = 'T' + n + ' · Menu sakafo';
})();
</script>
<!-- Le menu de Ny asako Hôtellerie, que le lien désigne : la page de
     l'hôtel (gestion-stockage-js/hotelerie.js) l'écrit dans la table
     hotelerie_menu, que « ?id=<compte> » lit ; un ancien lien « #m=… » porte
     encore le menu en lui-même. Avec « ?id », le client choisit sa latabatra
     et commande : la commande va dans hotelerie_commande, que l'onglet
     « Commandes » de l'hôtel lit. « &latabatra=3 » préchoisit la table (un
     lien, ou un QR, posé sur chacune). -->
<style>
  :root{ --bg:#f6f8f9; --card:#fff; --text:#1d2a30; --muted:#64757d; --line:#dbe3e6; --accent:#0f8a92; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f171b; --card:#16222a; --text:#e6eef0; --muted:#8fa3aa; --line:#25343b; --accent:#4fd8e0; }
  }
  :root[data-theme="dark"]{ --bg:#0f171b; --card:#16222a; --text:#e6eef0; --muted:#8fa3aa; --line:#25343b; --accent:#4fd8e0; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main{ max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1{ font-size:1.5rem; margin:0; display:flex; align-items:center; gap:0.5rem; }
  h1 img{ width:2.6rem; height:2.6rem; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
  .sous{ color:var(--muted); margin:0.2rem 0 1.4rem; }
  h2{ font-size:1rem; margin:1.4rem 0 0.6rem; }
  .plat{ display:flex; gap:0.8rem; justify-content:space-between; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:0.7rem 0.9rem; margin-bottom:0.5rem; }
  .plat .sary{ width:64px; height:64px; object-fit:cover; border-radius:8px; flex:0 0 auto; border:1px solid var(--line); }
  .plat small{ display:block; color:var(--muted); }
  .prix{ font-weight:700; color:var(--accent); white-space:nowrap; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:8px; padding:0.5rem 0.9rem; margin-top:1.4rem; }
  .vide{ color:var(--muted); }
  .isa{ display:flex; align-items:center; gap:0.4rem; margin-top:0.4rem; }
  .isa button{ margin:0; padding:0.15rem 0.7rem; font-weight:700; }
  .isa span{ min-width:1.4rem; text-align:center; font-weight:700; }
  .commande{ position:sticky; bottom:0; background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:0.8rem 0.9rem; margin-top:1.2rem; box-shadow:0 -4px 16px rgba(0,0,0,0.12); }
  .commande h3{ margin:0 0 0.5rem; font-size:1rem; }
  .commande select, .commande input{ width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:0.5rem 0.6rem; margin-bottom:0.5rem; }
  .commande .alefa{ width:100%; margin-top:0.2rem; background:var(--accent); color:var(--bg); font-weight:700; }
  .commande .alefa:disabled{ opacity:0.5; cursor:default; }
  .fandoavana{ margin:0 0 0.5rem; }
  .fandoavana .titre{ margin:0 0 0.35rem; font-weight:700; font-size:0.9rem; }
  .fombas{ display:flex; gap:0.35rem; flex-wrap:wrap; }
  .fombas .fomba{ margin:0; padding:0.35rem 0.7rem; font-size:0.85rem; color:var(--text); border-color:var(--line); }
  .fombas .fomba.choisi{ border-color:var(--accent); color:var(--accent); font-weight:700; background:rgba(15,138,146,0.1); }
  .total{ font-weight:700; color:var(--accent); }
  .voaray{ color:var(--accent); font-weight:600; margin:0.5rem 0 0; }
  .installer{ display:none; align-items:center; justify-content:space-between; gap:0.6rem; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:0.6rem 0.8rem; margin:0 0 1rem; }
  .installer p{ margin:0; font-size:0.85rem; color:var(--muted); flex:1 1 200px; }
  .installer button{ margin:0; }
</style>
</head>
<body>
<main>
  <h1 id="tete"><span id="teteLogo"><img src="/icone-192.png" alt=""></span> <span id="teteNom">Ny asako Hôtellerie</span></h1>
  <p class="sous">🍽️ Menu sakafo</p>
  <div class="installer" id="installer">
    <p id="installerTexte">Apetraho eo amin'ny écran ny menu, hisokatra avy hatrany.</p>
    <button type="button" id="installerBouton">📲 Installer</button>
  </div>
  <div id="menu"></div>
</main>
<script>
(function () {
  const SOKAJY = {
    maraina: '🌅 Sakafo maraina', atoandro: '🍛 Sakafo atoandro', hariva: '🌙 Sakafo hariva',
    fisotro: '🥤 Zava-pisotro', tsindrina: '🍰 Tsindrin-tsakafo'
  };
  const boite = document.getElementById('menu');
  function ariary(n) { return Number(n || 0).toLocaleString('fr-FR') + ' Ar'; }
  function el(tag, texte, classe) {
    const e = document.createElement(tag);
    if (texte != null) e.textContent = texte;
    if (classe) e.className = classe;
    return e;
  }
  function memoLire(k) { try { return sessionStorage.getItem('menu_' + k); } catch (e) { return null; } }
  function memoEcrire(k, v) { try { sessionStorage.setItem('menu_' + k, v); } catch (e) { } }

  // Deux sortes de liens. « ?id=<compte> » : le menu se lit en ligne, et
  // suit chaque changement de l'hôtel ; on peut y commander. « #m=… » :
  // l'ancien lien, qui porte en lui le menu du jour où il a été fait.
  const URL_SB = 'https://ezpsapvthujkhttbfhlr.supabase.co';
  const CLE_SB = 'sb_publishable_7YAttwKbsmxJUxn9IwR86g_9_h4ZThk';
  const ORDRE = Object.keys(SOKAJY);
  const params = new URLSearchParams(location.search);
  // L'hôtel du lien, retenu : l'application installée qui s'ouvrirait sans
  // lui (un écran d'accueil qui a perdu l'adresse) retrouve quand même le sien.
  function retenuLire(k) { try { return localStorage.getItem('menu_sakafo_' + k); } catch (e) { return null; } }
  function retenuEcrire(k, v) { try { localStorage.setItem('menu_sakafo_' + k, v); } catch (e) { } }
  const ID_VALIDE = /^[0-9a-f-]{36}$/i;
  let id = params.get('id');
  if (id && ID_VALIDE.test(id)) {
    retenuEcrire('id', id);
    if (params.get('latabatra')) retenuEcrire('latabatra', params.get('latabatra'));
  } else if (!/[#&]m=/.test(location.hash)) {
    id = retenuLire('id');
  }
  const enLigne = !!(id && ID_VALIDE.test(id));

  // La commande en cours : nom du plat → nombre. Elle survit au
  // rafraîchissement du menu (toutes les 30 s), tant que le plat existe.
  const panier = {};
  let prixDuMenu = {};
  let nbLatabatra = 10;
  let latabatraChoisie = Number(params.get('latabatra')) || Number(memoLire('latabatra')) ||
    Number(params.get('id') ? 0 : retenuLire('latabatra')) || 0;
  // Le lien d'une latabatra (son application) : la table est celle-là, on ne
  // la choisit plus.
  const tableFixe = enLigne && params.get('id') && Number.isInteger(Number(params.get('latabatra'))) &&
    Number(params.get('latabatra')) > 0 ? Number(params.get('latabatra')) : 0;
  if (tableFixe) {
    document.querySelector('.sous').textContent = '🍽️ Menu sakafo · T' + tableFixe;
    document.getElementById('installerTexte').textContent =
      "Apetraho eo amin'ny écran ny menu an'ny T" + tableFixe + ', hisokatra avy hatrany.';
  }

  function depuisLeLien() {
    try {
      const code = (location.hash.match(/[#&]m=([^&]+)/) || [])[1];
      const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
      const octets = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
      const l = JSON.parse(new TextDecoder().decode(octets));
      return Array.isArray(l) ? l : [];
    } catch (e) { return []; }
  }
  // La ligne en ligne garde tous les plats, « lany » compris : on ne montre
  // que ceux qui sont là, dans l'ordre des sokajy.
  function depuisLaBase(plats) {
    return (Array.isArray(plats) ? plats : [])
      .filter(function (p) { return p && p.misy; })
      .sort(function (a, b) {
        const d = ORDRE.indexOf(a.sokajy) - ORDRE.indexOf(b.sokajy);
        return d || String(a.anarana).localeCompare(String(b.anarana), 'fr');
      })
      .map(function (p) { return [p.anarana, p.sokajy, p.vidiny, p.famaritana || '', Array.isArray(p.tables) ? p.tables : null, saryValide(p.sary)]; });
  }
  // La photo d'un plat : une adresse du bucket de l'hôtel, ou une petite
  // image posée dans le plat même. Rien d'autre ne s'affiche.
  function saryValide(v) {
    v = String(v || '');
    return (v.indexOf(URL_SB + '/storage/v1/object/public/hotelerie-sary/') === 0 || /^data:image\/(jpeg|png|webp);base64,/.test(v)) ? v : '';
  }
  // Un plat qui nomme ses latabatra ne se voit qu'à elles ; tant que le client
  // n'a pas choisi la sienne, il ne voit que ce qui est servi partout.
  function pourLaTable(plats) {
    return plats.filter(function (p) {
      const t = p[4];
      return !t || (latabatraChoisie && t.indexOf(latabatraChoisie) >= 0);
    });
  }

  let empreinte = null;
  let dernierRecu = [];
  function afficher(tous) {
    dernierRecu = tous;
    const plats = pourLaTable(tous);
    const e = JSON.stringify(plats) + '|' + nbLatabatra + '|' + latabatraChoisie;
    if (e === empreinte) return;
    empreinte = e;
    // Ce que le client a déjà écrit ne doit pas s'effacer au rafraîchissement.
    const noteAvant = document.getElementById('fanamarihana');
    const note = noteAvant ? noteAvant.value : '';
    boite.innerHTML = '';
    if (!plats.length) {
      boite.appendChild(el('p', tous.length
        ? "Tsy misy sakafo ho an'ity latabatra ity." + (tableFixe ? '' : ' Safidio ny latabatra misy anao.')
        : "Tsy misy menu ato amin'ity rohy ity.", 'vide'));
      // Le choix de la table reste là : c'est par lui que le menu revient.
      if (enLigne && tous.length) { boite.appendChild(boiteCommande()); majCommande(); }
      return;
    }
    prixDuMenu = {};
    plats.forEach(function (p) { prixDuMenu[String(p[0] || '')] = Number(p[2]) || 0; });
    Object.keys(panier).forEach(function (k) { if (!(k in prixDuMenu)) delete panier[k]; });

    const lignes = ['🏨 ' + nomHotel + ' — 🍽️ Menu sakafo'];
    let courant = null;
    plats.forEach(function (p) {
      const anarana = String(p[0] || ''), sokajy = String(p[1] || ''), famaritana = String(p[3] || '');
      if (sokajy !== courant) {
        courant = sokajy;
        boite.appendChild(el('h2', SOKAJY[sokajy] || sokajy));
        lignes.push('', SOKAJY[sokajy] || sokajy);
      }
      const ligne = el('div', null, 'plat');
      if (p[5]) {
        const img = el('img', null, 'sary');
        img.src = p[5]; img.alt = ''; img.loading = 'lazy';
        ligne.appendChild(img);
      }
      const gauche = el('div');
      gauche.style.flex = '1 1 auto';
      gauche.appendChild(el('strong', anarana));
      if (famaritana) gauche.appendChild(el('small', famaritana));
      if (enLigne) gauche.appendChild(compteur(anarana));
      ligne.appendChild(gauche);
      ligne.appendChild(el('span', ariary(p[2]), 'prix'));
      boite.appendChild(ligne);
      lignes.push('• ' + anarana + ' : ' + ariary(p[2]) + (famaritana ? ' (' + famaritana + ')' : ''));
    });

    // Pour recoller le menu ailleurs, tel quel, en texte.
    const bouton = el('button', '📋 Adikao ny menu');
    bouton.type = 'button';
    bouton.addEventListener('click', function () {
      const texte = lignes.join('\n');
      function fait() { bouton.textContent = '✅ Voadika'; setTimeout(function () { bouton.textContent = '📋 Adikao ny menu'; }, 1800); }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texte).then(fait, fait);
      else {
        const t = document.createElement('textarea');
        t.value = texte; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e) { }
        t.remove(); fait();
      }
    });
    boite.appendChild(bouton);

    if (enLigne) {
      boite.appendChild(boiteCommande());
      document.getElementById('fanamarihana').value = note;
      majCommande();
    }
  }

  // ---------- La commande ----------
  function compteur(anarana) {
    const z = el('div', null, 'isa');
    const moins = el('button', '−'); moins.type = 'button';
    const n = el('span', String(panier[anarana] || 0));
    const plus = el('button', '+'); plus.type = 'button';
    moins.setAttribute('aria-label', 'Esory ' + anarana);
    plus.setAttribute('aria-label', 'Ampio ' + anarana);
    function changer(d) {
      const v = Math.max(0, Math.min(50, (panier[anarana] || 0) + d));
      if (v) panier[anarana] = v; else delete panier[anarana];
      n.textContent = String(v);
      majCommande();
    }
    moins.addEventListener('click', function () { changer(-1); });
    plus.addEventListener('click', function () { changer(1); });
    z.appendChild(moins); z.appendChild(n); z.appendChild(plus);
    return z;
  }
  function lignesDuPanier() {
    return Object.keys(panier).map(function (k) { return { anarana: k, vidiny: prixDuMenu[k] || 0, isa: panier[k] }; });
  }
  // ---------- Le paiement ----------
  // Vola an-tanana, ou mobile money vers les numéros que l'hôtel a écrits
  // (tete.vola). Le client peut donner la réf de son envoi ; c'est l'hôtel qui
  // dit « voaloa ».
  const NOM_FOMBA = { vola: '💵 Vola an-tanana', mvola: 'MVola', orange: 'Orange Money', airtel: 'Airtel Money' };
  let vola = {};
  let fandoavana = 'vola';
  let refFandoavana = '';
  function choixFandoavana() {
    const z = el('div', null, 'fandoavana');
    z.appendChild(el('p', '💳 Fandoavana', 'titre'));
    const fombas = ['vola'].concat(['mvola', 'orange', 'airtel'].filter(function (k) { return vola[k]; }));
    if (fombas.indexOf(fandoavana) < 0) fandoavana = 'vola';
    const rangee = el('div', null, 'fombas');
    fombas.forEach(function (k) {
      const b = el('button', k === 'vola' ? NOM_FOMBA.vola : '📱 ' + NOM_FOMBA[k], 'fomba' + (k === fandoavana ? ' choisi' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', k === fandoavana ? 'true' : 'false');
      b.addEventListener('click', function () {
        fandoavana = k;
        z.replaceWith(choixFandoavana());
        majCommande();
      });
      rangee.appendChild(b);
    });
    z.appendChild(rangee);
    if (fandoavana !== 'vola') {
      const info = el('p', null, 'vide');
      info.id = 'fandoavanaInfo';
      info.style.margin = '0.4rem 0';
      z.appendChild(info);
      const ref = document.createElement('input');
      ref.type = 'text'; ref.id = 'fandoavanaRef'; ref.maxLength = 60;
      ref.placeholder = 'Réf / laharan\'ny fandefasana (raha efa nalefa)';
      ref.value = refFandoavana;
      ref.addEventListener('input', function () { refFandoavana = ref.value; });
      z.appendChild(ref);
    }
    return z;
  }
  function boiteCommande() {
    const z = el('div', null, 'commande');
    // L'application d'une table l'écrit, sans menu déroulant — sauf si
    // l'hôtel a depuis réduit son nombre de latabatra : on redonne le choix.
    if (tableFixe && latabatraChoisie === tableFixe) {
      z.appendChild(el('h3', '🛎️ Commande · T' + tableFixe));
    } else {
      z.appendChild(el('h3', '🛎️ Commande'));
      z.appendChild(choixLatabatra());
    }
    const note = document.createElement('input');
    note.type = 'text'; note.id = 'fanamarihana'; note.maxLength = 300;
    note.placeholder = 'Fanamarihana (raha misy) : tsy misy sakay...';
    z.appendChild(note);
    z.appendChild(choixFandoavana());
    const resume = el('p', '', 'vide'); resume.id = 'resume'; resume.style.margin = '0 0 0.4rem';
    z.appendChild(resume);
    const alefa = el('button', '✅ Alefa ny commande', 'alefa'); alefa.type = 'button'; alefa.id = 'alefa';
    alefa.addEventListener('click', envoyerCommande);
    z.appendChild(alefa);
    const voaray = el('p', '', 'voaray'); voaray.id = 'voaray'; voaray.style.display = 'none';
    z.appendChild(voaray);
    return z;
  }
  function choixLatabatra() {
    const choix = document.createElement('select');
    choix.id = 'latabatra';
    choix.setAttribute('aria-label', 'Latabatra');
    const vide = el('option', '— Safidio ny latabatra —'); vide.value = '';
    choix.appendChild(vide);
    for (let i = 1; i <= nbLatabatra; i++) {
      const o = el('option', 'T' + i); o.value = String(i);
      if (i === latabatraChoisie) o.selected = true;
      choix.appendChild(o);
    }
    choix.addEventListener('change', function () {
      latabatraChoisie = Number(choix.value) || 0;
      memoEcrire('latabatra', String(latabatraChoisie || ''));
      // Le menu change avec la table : on le redessine.
      afficher(dernierRecu);
      majCommande();
    });
    return choix;
  }
  function majCommande() {
    const resume = document.getElementById('resume');
    const alefa = document.getElementById('alefa');
    if (!resume || !alefa) return;
    const l = lignesDuPanier();
    const isa = l.reduce(function (s, x) { return s + x.isa; }, 0);
    const total = l.reduce(function (s, x) { return s + x.isa * x.vidiny; }, 0);
    resume.replaceChildren();
    if (!isa) resume.textContent = "Tsindrio ny « + » eo amin'ny sakafo tianao.";
    else {
      resume.appendChild(document.createTextNode(isa + ' zavatra · '));
      resume.appendChild(el('span', ariary(total), 'total'));
    }
    const info = document.getElementById('fandoavanaInfo');
    if (info && vola[fandoavana]) {
      info.replaceChildren();
      info.appendChild(document.createTextNode('Alefaso ' + (total ? 'ny ' : '')));
      if (total) info.appendChild(el('span', ariary(total), 'total'));
      info.appendChild(document.createTextNode(' amin\'ny ' + NOM_FOMBA[fandoavana] + ' : '));
      info.appendChild(el('strong', vola[fandoavana]));
      if (vola.tompony) info.appendChild(document.createTextNode(' (' + vola.tompony + ')'));
    }
    alefa.disabled = !isa || !latabatraChoisie;
    alefa.textContent = (isa && !latabatraChoisie) ? 'Safidio aloha ny latabatra' : '✅ Alefa ny commande';
  }
  function envoyerCommande() {
    const alefa = document.getElementById('alefa');
    const l = lignesDuPanier();
    if (!l.length || !latabatraChoisie) return;
    alefa.disabled = true;
    alefa.textContent = '⏳ Alefa...';
    const totalAlefa = l.reduce(function (s, x) { return s + x.isa * x.vidiny; }, 0);
    fetch(URL_SB + '/rest/v1/hotelerie_commande', {
      method: 'POST',
      headers: { apikey: CLE_SB, Authorization: 'Bearer ' + CLE_SB, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        hotel_id: id, latabatra: latabatraChoisie, plats: l,
        fanamarihana: (document.getElementById('fanamarihana').value || '').trim() || null,
        fandoavana: fandoavana,
        fandoavana_ref: fandoavana !== 'vola' && refFandoavana.trim() ? refFandoavana.trim().slice(0, 60) : null
      })
    }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      Object.keys(panier).forEach(function (k) { delete panier[k]; });
      document.querySelectorAll('.isa span').forEach(function (s) { s.textContent = '0'; });
      document.getElementById('fanamarihana').value = '';
      const sansRef = fandoavana !== 'vola' && !refFandoavana.trim();
      const voaray = document.getElementById('voaray');
      voaray.style.display = '';
      voaray.textContent = '✅ Voaray ny commande (T' + latabatraChoisie + '). ' + (sansRef
        ? 'Alefaso ny ' + ariary(totalAlefa) + ' amin\'ny ' + NOM_FOMBA[fandoavana] + ' ' + vola[fandoavana] +
          (vola.tompony ? ' (' + vola.tompony + ')' : '') + ', dia lazao ny réf amin\'ny mpandroso sakafo.'
        : fandoavana === 'vola' ? 'Aloavy amin\'ny mpandroso sakafo ny vola. Misaotra !' : 'Hamarinin\'ny hotely ny fandoavana. Misaotra !');
      refFandoavana = '';
      const champRef = document.getElementById('fandoavanaRef');
      if (champRef) champRef.value = '';
      clearTimeout(voaray._t);
      voaray._t = setTimeout(function () { voaray.style.display = 'none'; }, sansRef ? 60000 : 10000);
      majCommande();
    }).catch(function () {
      alert('Tsy lasa ny commande : jereo ny connexion, dia avereno.');
      majCommande();
    });
  }

  function charger() {
    fetch(URL_SB + '/rest/v1/hotelerie_menu?select=plats,latabatra,tete&user_id=eq.' + encodeURIComponent(id),
      { headers: { apikey: CLE_SB, Authorization: 'Bearer ' + CLE_SB }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (rangs) {
        retenuEcrire('dernier_' + id, JSON.stringify(rangs[0] || null));
        recevoir(rangs[0]);
      })
      .catch(function () {
        if (empreinte !== null) return;
        // Hors réseau : la dernière version reçue, plutôt qu'une page vide.
        let garde = null;
        try { garde = JSON.parse(retenuLire('dernier_' + id)); } catch (e) { }
        if (garde) recevoir(garde);
        else boite.replaceChildren(el('p', 'Tsy azo ny menu : jereo ny connexion, dia avereno.', 'vide'));
      });
  }
  // La tête que l'hôtel a choisie : son nom, son logo. Rien de choisi,
  // le logo de Ny asako et « Ny asako Hôtellerie ».
  let nomHotel = 'Ny asako Hôtellerie';
  function poserTete(t) {
    t = t && typeof t === 'object' ? t : {};
    nomHotel = String(t.anarana || '').trim().slice(0, 60) || 'Ny asako Hôtellerie';
    const v = t.vola && typeof t.vola === 'object' ? t.vola : {};
    const avant = JSON.stringify(vola);
    vola = {};
    ['mvola', 'orange', 'airtel'].forEach(function (k) {
      const n = String(v[k] || '').trim();
      if (/^\+?[0-9 ]{6,20}$/.test(n)) vola[k] = n;
    });
    if (v.tompony) vola.tompony = String(v.tompony).trim().slice(0, 60);
    // Les numéros ont changé : le choix se redessine (le menu, lui, ne
    // changerait peut-être pas).
    if (JSON.stringify(vola) !== avant) empreinte = null;
    document.getElementById('teteNom').textContent = nomHotel;
    const logo = document.getElementById('teteLogo');
    // Sans sary choisi : le logo de Ny asako.
    const sary = saryValide(t.sary) || '/icone-192.png';
    const deja = logo.querySelector('img');
    if (!deja || deja.getAttribute('src') !== sary) {
      const img = document.createElement('img');
      img.src = sary; img.alt = '';
      logo.replaceChildren(img);
    }
  }
  function recevoir(rang) {
    poserTete(rang && rang.tete);
    if (rang && rang.latabatra) nbLatabatra = rang.latabatra;
    if (latabatraChoisie > nbLatabatra) latabatraChoisie = 0;
    afficher(depuisLaBase(rang && rang.plats));
  }

  // ---------- L'installation ----------
  // Android / ordinateur : le navigateur propose l'installation, on la garde
  // pour le bouton. iPhone : rien à proposer, on dit où toucher.
  (function () {
    const boiteInst = document.getElementById('installer');
    const bouton = document.getElementById('installerBouton');
    const texte = document.getElementById('installerTexte');
    const installee = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (installee) return;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/menu-sakafo-sw.js', { scope: '/menu-sakafo.html' }).catch(function () { });
    }
    let invite = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      invite = e;
      bouton.style.display = '';
      boiteInst.style.display = 'flex';
    });
    bouton.addEventListener('click', function () {
      if (!invite) return;
      invite.prompt();
      invite.userChoice.then(function () { invite = null; boiteInst.style.display = 'none'; });
    });
    window.addEventListener('appinstalled', function () { boiteInst.style.display = 'none'; });
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      texte.textContent = "Mba hametrahana ny menu eo amin'ny écran : tsindrio ny ⎙ (Partager) eo ambany, dia « Sur l'écran d'accueil ».";
      bouton.style.display = 'none';
      boiteInst.style.display = 'flex';
    }
  })();

  if (enLigne) {
    charger();
    // Le client garde la page ouverte : elle suit les changements d'elle-même.
    setInterval(function () { if (!document.hidden) charger(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) charger(); });
  } else {
    afficher(depuisLeLien());
  }
})();
</script>
</body>
</html>
