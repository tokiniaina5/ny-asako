# Comment Netlify publie ce dépôt.
#
# « npm run build » estampille d'abord les adresses des feuilles de style et
# des scripts (outils/versionner.mjs) et renomme le cache du service worker,
# puis outils/build.mjs copie le site dans dist/ en le réduisant (HTML, CSS,
# JS minifiés). Les fichiers gardent leur nom et leur place : _redirects,
# _headers, sw.js et les « ?v= » restent valables.
#
# supabase/, outils/, netlify/ et le mode d'emploi ne partent pas dans dist/.
# Les fonctions Edge sont lues dans netlify/edge-functions, à la racine.

[build]
  command = "npm run build"
  publish = "dist"
