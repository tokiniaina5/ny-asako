<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Handoa · Ny asako</title>
<link rel="icon" href="/icone-192.png">
<!-- La page du QR de paiement (menu-sakafo.html), pour MVola, Orange Money
     et Airtel Money. Le QR porte : c = le code qui ouvre « envoyer de
     l'argent » chez l'opérateur (seulement des codes publiés), n = le numéro
     de l'hôtel, v = la somme, h = l'hôtel, t = le nom du titulaire, et pour
     MVola k = le code avec numéro et somme dedans (non publié : proposé en
     plus). Chaque morceau se copie d'un appui ; un iPhone refuse d'ouvrir un
     code * ou # depuis un lien (Apple l'interdit), Android l'ouvre par
     « 📞 Antsoy ». Rien n'est payé ni envoyé depuis cette page. -->
<style>
  :root{ --bg:#f6f8f9; --card:#fff; --text:#1d2a30; --muted:#64757d; --line:#dbe3e6; --accent:#0f8a92; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f171b; --card:#16222a; --text:#e6eef0; --muted:#8fa3aa; --line:#25343b; --accent:#4fd8e0; }
  }
  :root[data-theme="dark"]{ --bg:#0f171b; --card:#16222a; --text:#e6eef0; --muted:#8fa3aa; --line:#25343b; --accent:#4fd8e0; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main{ max-width:480px; margin:0 auto; padding:24px 16px 40px; }
  .carte{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:1.2rem 1.1rem; }
  h1{ font-size:1.25rem; margin:0 0 0.2rem; }
  .sous{ color:var(--muted); margin:0 0 0.6rem; font-size:0.92rem; }
  .somme{ font-size:2rem; font-weight:800; color:var(--accent); margin:0.1rem 0 0.2rem; }
  .fomba{ font-weight:700; margin:0 0 0.6rem; }
  .etape{ border-top:1px solid var(--line); padding:0.9rem 0 0.2rem; }
  .etape h2{ font-size:0.95rem; margin:0 0 0.4rem; display:flex; gap:0.5rem; align-items:center; }
  .etape h2 b{ display:inline-flex; width:1.5rem; height:1.5rem; border-radius:50%; background:var(--accent); color:var(--card); align-items:center; justify-content:center; font-size:0.85rem; flex:0 0 auto; }
  .valeur{ display:flex; align-items:center; gap:0.5rem; }
  /* Sur une seule ligne, toujours : un code coupé (« # » seul en dessous)
     se lit mal et se recopie de travers. La taille se réduit pour tenir
     (ajuster(), plus bas). */
  .valeur code{ flex:1; min-width:0; padding:0.7rem 0.6rem; border:2px dashed var(--accent); border-radius:12px; text-align:center;
    font:700 1.3rem/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing:0.02em; white-space:nowrap; overflow:hidden; user-select:all; }
  .valeur button{ flex:0 0 auto; width:auto; margin:0; padding:0.7rem 0.8rem; }
  /* Un code long prend toute la largeur ; « Adikao » passe dessous. */
  .valeur.lava{ flex-direction:column; align-items:stretch; }
  .valeur.lava code{ padding:0.8rem 0.4rem; letter-spacing:0; }
  .valeur.lava button{ width:100%; }
  button, .bouton{ display:block; width:100%; text-align:center; font:inherit; font-weight:700; cursor:pointer; text-decoration:none;
    border-radius:12px; padding:0.8rem 1rem; margin-top:0.6rem; }
  .plein{ background:var(--accent); color:var(--card); border:2px solid var(--accent); }
  .contour{ background:transparent; color:var(--text); border:2px solid var(--text); }
  .note{ color:var(--muted); font-size:0.86rem; margin:0.4rem 0 0; }
  .haingana{ margin-top:1rem; border:1px solid var(--line); border-radius:12px; padding:0.6rem 0.8rem; }
  .haingana summary{ cursor:pointer; font-weight:700; font-size:0.92rem; }
  .erreur{ color:#e05a5a; }
</style>
<!-- Les émojis dessinés en 3D (emoji-3d.js). -->
<script src="/gestion-stockage-js/emoji-3d.js?v=66dad412" defer></script>
</head>
<body>
<main>
  <div class="carte" id="carte">
    <h1>💳 Handoa</h1>
    <p class="sous" id="hotely"></p>
    <p class="somme" id="somme"></p>
    <p class="fomba notranslate" id="fomba" translate="no"></p>
    <div id="etapes"></div>
  </div>
</main>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const carte = document.getElementById('carte');
  function el(tag, texte, classe) {
    const e = document.createElement(tag);
    if (texte != null) e.textContent = texte;
    if (classe) e.className = classe;
    return e;
  }
  // Un code USSD ne contient que des chiffres, * et # : le reste est refusé,
  // pour qu'un lien trafiqué ne fasse rien composer d'autre.
  const USSD_VALIDE = /^[#*0-9]{3,60}$/;
  const code = String(p.get('c') || '');
  if (!USSD_VALIDE.test(code)) {
    carte.innerHTML = '<p class="erreur">Tsy mety ity rohy ity. Scanneo indray ny QR ao amin\'ny menu.</p>';
    return;
  }
  const NOMS = { mvola: 'MVola', orange: 'Orange Money', airtel: 'Airtel Money' };
  const f = p.get('f');
  const nom = NOMS[f] || 'Mobile money';
  const laharana = String(p.get('n') || '').replace(/[^\d+]/g, '').slice(0, 20);
  const somme = Math.round(Number(p.get('v')) || 0);
  const tompony = String(p.get('t') || '').slice(0, 40);
  const feno = String(p.get('k') || '');

  document.getElementById('hotely').textContent = String(p.get('h') || '').slice(0, 60);
  document.getElementById('somme').textContent = somme ? ariary(somme) : '';
  document.getElementById('fomba').textContent = '📱 ' + nom;

  const iphone = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function copier(texte, bouton, libelle) {
    function fait() {
      bouton.textContent = '✅ Voadika';
      setTimeout(function () { bouton.textContent = libelle; }, 1800);
    }
    function vieux() {
      const t = document.createElement('textarea');
      t.value = texte; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, texte.length);
      try { document.execCommand('copy'); fait(); } catch (e) { bouton.textContent = 'Tsindrio ela ilay soratra'; }
      t.remove();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texte).then(fait, vieux);
    else vieux();
  }
  // 24242 → « 24.242 MGA » : lisible à l'écran. Ce qu'on copie reste les
  // chiffres seuls, que le menu de l'opérateur attend.
  function ariary(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' MGA'; }
  // Une valeur en grand, avec son bouton « Adikao » (affiche, si donné,
  // remplace le texte à l'écran ; la copie garde le texte).
  function valeur(texte, affiche) {
    const lava = (affiche || texte).length > 12;
    const v = el('div', null, 'valeur' + (lava ? ' lava' : ''));
    const c = el('code', affiche || texte);
    c.setAttribute('translate', 'no'); c.className = 'notranslate';
    const libelle = lava ? '📋 Adikao' : '📋';
    const b = el('button', libelle, 'plein');
    b.type = 'button';
    b.setAttribute('aria-label', 'Adikao');
    b.addEventListener('click', function () { copier(texte, b, libelle); });
    v.appendChild(c); v.appendChild(b);
    return v;
  }
  function antsoy(c, libelle, classe) {
    const a = el('a', libelle, 'bouton ' + classe);
    a.href = 'tel:' + encodeURIComponent(c);
    return a;
  }
  function etape(n, titre) {
    const e = el('div', null, 'etape');
    const h = el('h2');
    h.appendChild(el('b', String(n)));
    h.appendChild(document.createTextNode(titre));
    e.appendChild(h);
    return e;
  }

  const z = document.getElementById('etapes');
  // 1. Le code de l'opérateur.
  const e1 = etape(1, 'Antsoy ity code ity');
  e1.appendChild(valeur(code));
  if (!iphone) e1.appendChild(antsoy(code, '📞 Antsoy', 'plein'));
  e1.appendChild(el('p', iphone
    ? "iPhone : tsindrio ny 📋, sokafy ny Téléphone › Clavier, tsindrio ela › Coller, dia antsoy."
    : "Raha tsy misokatra ny 📞, tsindrio ny 📋 dia apetaho ao amin'ny Téléphone.", 'note'));
  if (f === 'airtel') e1.appendChild(el('p', "Ao amin'ny menu Airtel Money, safidio « Mandefa vola » (Transfert).", 'note'));
  z.appendChild(e1);
  // 2. Le numéro de l'hôtel.
  if (laharana) {
    const e2 = etape(2, "Laharana handefasana");
    e2.appendChild(valeur(laharana));
    if (tompony) e2.appendChild(el('p', "Hamarino fa « " + tompony + " » no anarana miseho alohan'ny hanamafisana.", 'note'));
    z.appendChild(e2);
  }
  // 3. La somme, en chiffres seuls (c'est ce que le menu attend).
  if (somme) {
    const e3 = etape(laharana ? 3 : 2, 'Vola alefa');
    e3.appendChild(valeur(String(somme), ariary(somme)));
    e3.appendChild(el('p', "Ny isa ihany (" + somme + ") no adika : izay no soratana ao amin'ny téléphone.", 'note'));
    z.appendChild(e3);
  }
  // 4. Le code secret, que personne d'autre ne voit.
  const e4 = etape(z.children.length + 1, 'Ampidiro ny code miafinao');
  e4.appendChild(el('p', "Ao amin'ny téléphone-nao ihany : tsy misy mangataka azy eto. Rehefa lasa ny vola, lazao amin'ny mpandroso sakafo.", 'note'));
  z.appendChild(e4);

  // MVola : le code avec numéro et somme dedans — plus rapide quand le
  // téléphone l'accepte, mais non publié par l'opérateur : proposé en plus.
  if (feno && USSD_VALIDE.test(feno)) {
    const d = el('details', null, 'haingana');
    d.appendChild(el('summary', '⚡ Code haingana (efa misy ny laharana sy ny vola)'));
    d.appendChild(valeur(feno));
    if (!iphone) d.appendChild(antsoy(feno, '📞 Antsoy ny code haingana', 'contour'));
    d.appendChild(el('p', "Raha tsy mandeha amin'ny téléphone-nao ity, araho ny dingana 1 – " + z.children.length + " etsy ambony.", 'note'));
    d.addEventListener('toggle', ajuster);
    z.appendChild(d);
  }

  // Chaque code tient sur sa ligne : on réduit la police tant qu'il déborde.
  function ajuster() {
    document.querySelectorAll('.valeur code').forEach(function (c) {
      c.style.fontSize = '';
      let t = parseFloat(getComputedStyle(c).fontSize);
      while (c.scrollWidth > c.clientWidth && t > 11) {
        t -= 1;
        c.style.fontSize = t + 'px';
      }
    });
  }
  ajuster();
  window.addEventListener('resize', ajuster);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);
})();
</script>
</body>
</html>
